<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashcards: Leucocitos en frotis sanguíneo</title>
<style>
:root{--bg:#f6f3f8;--surf:#fff;--ink:#241a30;--mute:#6b5e78;--acc:#5b2a86;--ok:#1d7a4d;--bad:#b3362f;--line:#ddd3e6}
@media (prefers-color-scheme:dark){:root{--bg:#17111d;--surf:#221a2b;--ink:#f1eaf7;--mute:#a999b8;--acc:#c79bf0;--ok:#5fd09a;--bad:#ff8a82;--line:#3a2d48}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.3rem;margin:0 0 4px}
p.sub{margin:0 0 16px;color:var(--mute);font-family:system-ui,sans-serif;font-size:.9rem}
.bar{display:flex;justify-content:space-between;font-family:system-ui,sans-serif;font-size:.85rem;color:var(--mute);margin-bottom:8px}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.scene{perspective:1200px}
.card{position:relative;width:100%;min-height:520px;transform-style:preserve-3d;transition:transform .5s;cursor:pointer;border:0;background:none;padding:0;text-align:left;color:inherit;font:inherit}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;overflow:auto}
.back{transform:rotateY(180deg)}
.face img{width:100%;border-radius:8px;display:block;aspect-ratio:1/1;object-fit:cover}
.q{font-family:system-ui,sans-serif;margin:12px 0 0;text-align:center;font-weight:600}
.hint{font-family:system-ui,sans-serif;color:var(--mute);font-size:.82rem;text-align:center;margin-top:4px}
.back img{width:120px;height:120px;align-self:center}
.back h2{margin:12px 0 0;font-size:1.6rem;text-align:center;color:var(--acc)}
.back em{display:block;text-align:center;color:var(--mute);margin-bottom:12px}
.back p{margin:0 0 10px;line-height:1.5;font-size:1rem}
.back b{font-family:system-ui,sans-serif;font-size:.85rem;color:var(--mute);display:block}
.ctl{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
button.b{flex:1;min-width:90px;font:600 .9rem system-ui,sans-serif;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--surf);color:var(--ink);cursor:pointer}
button.b:focus-visible,.card:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.ok{color:var(--ok)}.no{color:var(--bad)}
.done{text-align:center;padding:40px 16px;background:var(--surf);border:1px solid var(--line);border-radius:14px}
@media (max-width:420px){.card{min-height:560px}}
@media (prefers-reduced-motion:reduce){.card,.prog i{transition:none}}
</style>
</head>
<body>
<main>
<h1>Leucocitos en frotis de sangre</h1>
<p class="sub">Identifica la célula marcada. Toca la tarjeta para ver la respuesta.</p>
<div id="app"></div>
</main>
<script>
const D=[
{img:"data:image/png;base64,...",n:"Neutrófilo",l:"Granulocytus neutrophilus",
 f:"Núcleo multilobulado (3–5 lóbulos unidos por finos filamentos) y citoplasma pálido con gránulos finos poco visibles.",
 d:"Es el leucocito más abundante: 40–75 %. Primera línea de defensa, fagocita bacterias."},
{img:"data:image/png;base64,...",n:"Linfocito",l:"Lymphocytus",
 f:"Célula pequeña con núcleo redondo, grande y muy oscuro que ocupa casi toda la célula; citoplasma escaso.",
 d:"20–45 % de los leucocitos. Incluye células B, T y NK; responsables de la inmunidad adaptativa."},
{img:"data:image/png;base64,...",n:"Monocito",l:"Monocytus",
 f:"Célula grande con núcleo excéntrico en forma de riñón o herradura (con muesca) y citoplasma gris azulado.",
 d:"2–10 % de los leucocitos. Es la célula leucocitaria más grande; en los tejidos se convierte en macrófago."},
{img:"data:image/png;base64,...",n:"Eosinófilo",l:"Granulocytus eosinophilus",
 f:"Núcleo bilobulado (en anteojos) y gránulos grandes y abundantes de color rojo anaranjado.",
 d:"1–6 % de los leucocitos. Participa en la defensa contra parásitos y en las reacciones alérgicas."},
{img:"data:image/png;base64,...",n:"Basófilo",l:"Granulocytus basophilus",
 f:"Gránulos grandes azul oscuro o púrpura que tapan el núcleo, de forma que casi no se distingue.",
 d:"0–1 %, el menos abundante. Liberan histamina y heparina; intervienen en la hipersensibilidad inmediata."}
];
let order=D.map((_,i)=>i),pos=0,known=new Set(),flip=false;
const app=document.getElementById('app');
function render(){
 if(pos>=order.length){
  app.innerHTML=`<div class="done"><h2>¡Terminaste!</h2><p>Acertaste ${known.size} de ${D.length}.</p><div class="ctl"><button class="b" id="again">Repetir todo</button>${known.size<D.length?'<button class="b" id="miss">Repasar las que fallé</button>':''}</div></div>`;
  document.getElementById('again').onclick=()=>{known.clear();order=D.map((_,i)=>i);pos=0;render()};
  const m=document.getElementById('miss');
  if(m)m.onclick=()=>{order=order.filter(i=>!known.has(i));known.clear();pos=0;render()};
  return;
 }
 const c=D[order[pos]];
 app.innerHTML=`<div class="bar"><span>Tarjeta ${pos+1} de ${order.length}</span><span>Acertadas: ${known.size}</span></div>
 <div class="prog"><i style="width:${pos/order.length*100}%"></i></div>
 <div class="scene"><button class="card${flip?' flip':''}" id="card" aria-label="Girar tarjeta">
  <div class="face"><img src="${c.img}" alt="Leucocito en frotis sanguíneo"><p class="q">¿Qué leucocito es el señalado?</p><p class="hint">Toca para ver la respuesta</p></div>
  <div class="face back"><img src="${c.img}" alt=""><h2>${c.n}</h2><em>${c.l}</em><p><b>Cómo reconocerlo</b>${c.f}</p><p><b>Dato clave</b>${c.d}</p></div>
 </button></div>
 <div class="ctl"><button class="b no" id="n">Fallé</button><button class="b ok" id="y">Acerté</button></div>
 <div class="ctl"><button class="b" id="p">Anterior</button><button class="b" id="s">Barajar</button><button class="b" id="x">Siguiente</button></div>`;
 document.getElementById('card').onclick=()=>{flip=!flip;document.getElementById('card').classList.toggle('flip',flip)};
 const go=d=>{flip=false;pos=Math.max(0,pos+d);render()};
 document.getElementById('y').onclick=()=>{known.add(order[pos]);go(1)};
 document.getElementById('n').onclick=()=>{known.delete(order[pos]);go(1)};
 document.getElementById('p').onclick=()=>go(-1);
 document.getElementById('x').onclick=()=>go(1);
 document.getElementById('s').onclick=()=>{order.sort(()=>Math.random()-.5);pos=0;flip=false;render()};
}
render();
</script>
</body>
</html>
